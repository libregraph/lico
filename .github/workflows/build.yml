name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: identifier/.bun-version

    - name: Cache identifier dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('identifier/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Bootstrap
      run: |
        go version
        bun --version

    - name: Vendor
      run: |
        make vendor
        make -C identifier vendor

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
        args: --timeout=2m
        skip-cache: true
        only-new-issues: true

    - name: Build
      run: |
        make DATE=reproducible
        ./bin/licod version && sha256sum ./bin/licod

    - name: Test
      run: make test

    - name: Dist
      run: |
        test -z "$(git diff --shortstat 2>/dev/null |tail -n1)" && echo "Clean check passed."
        make check
        make dist
