openapi: '3.0.0'

info:
  version: '1.2.0'
  title: LibreGraph Connect API
  description: |
    LibreGraph Connect (lico) provides OpenID Connect Provider (OP) functionality with an
    integrated web login and consent UI (the "identifier").

    This API implements:
    - OpenID Connect Core 1.0
    - OpenID Connect Discovery 1.0
    - OpenID Connect Session Management 1.0
    - OAuth 2.0 Authorization Framework
    - OAuth 2.0 Authorization Server Metadata (RFC 8414)
    - Proof Key for Code Exchange (RFC 7636), `S256` only
    - Resource Indicators for OAuth 2.0 (RFC 8707)
    - Dynamic Client Registration (only when explicitly enabled, see below)
    - SAML2 and OAuth2 integration with external identity providers

    ## Path prefixes

    Paths below are written with the default prefix. Two independent prefixes exist, both
    runtime configuration:

    | Prefix | Default | Used by |
    | --- | --- | --- |
    | Konnect API | `/konnect/v1` | `token`, `userinfo`, `jwks.json`, `session/`, `register` |
    | Signin / identifier | `/signin/v1` | the identifier web app, its JSON API, `authorize`, `endsession` |

    `authorize` and `endsession` live under the **signin** prefix, while `token`, `userinfo`
    and `jwks.json` live under the **konnect** prefix.

    The discovery document (`/.well-known/openid-configuration`) is generated from the same
    configuration that wires the routes, so it is the authoritative source for endpoint
    locations.

    The identifier web app is served at `{signin}/identifier` and issues its JSON API calls as
    URLs relative to that page, which is why the API sits at `{signin}/identifier/_/...`. The
    served `index.html` carries a `data-path-prefix` attribute on `#root` holding the signin
    prefix, so the app can construct absolute URLs when needed.

    ## Error conventions

    - The **OIDC/OAuth2 protocol endpoints** (`token`) return the JSON `OIDCError` shape.
    - `authorize` reports errors by **302 redirect** to the client's `redirect_uri` with
      `error`/`error_description`/`state` in the query or fragment. It does not return JSON.
    - The **identifier JSON endpoints** (`{signin}/identifier/_/*`) never return a JSON error
      body. Failures are `text/plain` from Go's `http.Error`, shaped
      `"<status> <reason>[ - <detail>]"`, e.g. `400 Bad Request - failed to decode request JSON`.
      See the `PlainTextError` response component.
    - Several handlers render an **HTML error page** for internal failures.

  contact:
    name: LibreGraph Developers
    url: https://github.com/libregraph/lico
  license:
    name: Apache License Version 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: 'https://{hostname}'
    variables:
      hostname:
        default: localhost:8443
        description: LibreGraph Connect issuer hostname and port

tags:
  - name: discovery
    description: OpenID Connect Discovery endpoints
  - name: oidc
    description: OpenID Connect core endpoints
  - name: identifier
    description: Identifier JSON API — authentication and consent, consumed by the web app
  - name: oauth2
    description: OAuth2 flow endpoints for external identity providers
  - name: saml2
    description: SAML2 integration endpoints
  - name: static
    description: Static assets and web app entry points
  - name: ops
    description: Operational endpoints

paths:
  # ---------------------------------------------------------------- discovery
  /.well-known/openid-configuration:
    get:
      tags: [discovery]
      summary: OpenID Connect Discovery Document
      description: |
        Returns the OpenID Connect provider metadata. This is the authoritative source for
        every other endpoint location. The document is built once at startup and served
        verbatim thereafter.
      operationId: getDiscovery
      responses:
        '200':
          description: Provider metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMetadata'

  /.well-known/oauth-authorization-server:
    get:
      tags: [discovery]
      summary: OAuth 2.0 Authorization Server Metadata
      description: |
        Returns the very same document as `/.well-known/openid-configuration`, byte for
        byte, under the well-known URI defined by
        [RFC 8414](https://datatracker.ietf.org/doc/html/rfc8414#section-3). OAuth 2.0
        clients which do not speak OpenID Connect discovery try this path first.

        When the issuer carries a path component, both documents are additionally served
        under the path-inserted form (`/.well-known/oauth-authorization-server{issuerPath}`,
        `/.well-known/openid-configuration{issuerPath}`) and, for OpenID Connect discovery,
        under the path-appended form (`{issuerPath}/.well-known/openid-configuration`).
      operationId: getOAuthAuthorizationServerMetadata
      responses:
        '200':
          description: Provider metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderMetadata'

  # ------------------------------------------------------------- oidc core
  /konnect/v1/jwks.json:
    get:
      tags: [oidc]
      summary: JSON Web Key Set
      description: |
        Returns the provider's public keys for JWT verification. Private key material is
        stripped. Every key is emitted with `use: "sig"`.
      operationId: getJWKS
      responses:
        '200':
          description: |
            JSON Web Key Set. Served as `application/jwk-set+json` — **not**
            `application/json`.
          content:
            application/jwk-set+json:
              schema:
                $ref: '#/components/schemas/JSONWebKeySet'

  /signin/v1/identifier/_/authorize:
    get:
      tags: [oidc]
      summary: Authorization Endpoint
      description: |
        OpenID Connect authorization endpoint for authorization code, implicit and hybrid
        flows. This endpoint lives under the **signin** prefix, not the konnect prefix.

        Unauthenticated requests are redirected to the identifier web app to sign in; the app
        later resumes the flow via `HelloResponse.continue_uri`.

        **Errors are not returned as JSON.** A request that validates far enough to know the
        client and `redirect_uri` is answered with a 302 to that `redirect_uri` carrying
        `error`, `error_description` and `state`, in the query string or the fragment
        depending on the response type. Requests that fail before that point render an HTML
        error page.

        A request naming a `resource` binds the tokens it leads to to that resource, which
        must be registered with this server, and narrows the requested scopes to the ones
        the resource accepts. A client which must use PKCE is not refused here: a code
        issued without a `code_challenge` is refused at the token endpoint instead.
      operationId: authorize
      parameters:
        - name: response_type
          in: query
          required: true
          description: |
            Space-delimited response type. The request validator accepts all seven values
            below.

            **Known inconsistency:** the discovery document's `response_types_supported`
            advertises `code`, `id_token`, `id_token token`, `code id_token` and
            `code id_token token`. Bare `token` and `code token` are accepted by this
            endpoint but are not advertised.

            Response types containing `id_token` additionally require `nonce`.
          schema:
            type: string
            enum:
              - code
              - id_token
              - token
              - 'code id_token'
              - 'code token'
              - 'code id_token token'
              - 'id_token token'
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          description: Space-delimited scope list. Must include `openid`.
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: nonce
          in: query
          description: Required when `response_type` contains `id_token`.
          schema:
            type: string
        - name: response_mode
          in: query
          description: |
            Only `query` and `fragment` are recognised. Unrecognised values are ignored
            rather than rejected. `form_post` is not implemented.
          schema:
            type: string
            enum: [query, fragment]
        - name: prompt
          in: query
          description: |
            Space-delimited. `none` must be requested on its own; the other values may be
            combined.
          schema:
            type: string
            enum: [none, login, consent, select_account]
        - name: max_age
          in: query
          schema:
            type: integer
        - name: id_token_hint
          in: query
          schema:
            type: string
        - name: claims
          in: query
          description: OpenID Connect claims request parameter. `claims_parameter_supported` is true.
          schema:
            type: string
        - name: request
          in: query
          description: |
            Request object as a JWT. `request_parameter_supported` is true;
            `request_uri_parameter_supported` is false.

            When the server runs with `--allow-client-signed-logins` and the request carries
            the `LibreGraph.SignedLoginOK` scope, this parameter selects the signed-login
            flow instead of the ordinary interactive flow.
          schema:
            type: string
        - name: registration
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          description: |
            PKCE challenge (RFC 7636). Accepted on every code flow and verified at the
            token endpoint. Required for dynamically registered clients, for static clients
            with `require_pkce`, and for every client when the server runs with
            `--require-pkce`.
          schema:
            type: string
        - name: code_challenge_method
          in: query
          description: Only `S256` is accepted. `plain` is explicitly rejected.
          schema:
            type: string
            enum: [S256]
        - name: resource
          in: query
          description: |
            Resource indicator (RFC 8707), the canonical URI of the protected resource the
            requested access token is for. At most one value: an absolute URI without
            query or fragment, `https` or `http` on a loopback host. Scheme and host are
            compared case-insensitively and a trailing slash is ignored.

            The resource must be registered in the `resources:` block of
            `--identifier-registration-conf` (see `ResourceRegistration`). It becomes the
            `aud` of the access token, and every requested scope but `openid` and
            `offline_access` which the resource does not accept is dropped. Several values,
            a malformed value or an unregistered resource are answered with an
            `invalid_target` error redirect.
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: |
            Redirect to the client with the authorization response, redirect to the client
            with an error, or redirect to the identifier web app to authenticate.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: HTML error page for requests that fail before the client is resolved.
          content:
            text/plain:
              schema:
                type: string
    post:
      tags: [oidc]
      summary: Authorization Endpoint (POST)
      description: Same semantics as GET, with parameters supplied as a form body.
      operationId: authorizePost
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: Same parameter set as the GET operation.
              properties:
                response_type:
                  type: string
                client_id:
                  type: string
                redirect_uri:
                  type: string
                scope:
                  type: string
                state:
                  type: string
                nonce:
                  type: string
                code_challenge:
                  type: string
                code_challenge_method:
                  type: string
                resource:
                  type: string
      responses:
        '302':
          description: As for GET.
        '400':
          description: As for GET.

  /konnect/v1/token:
    post:
      tags: [oidc]
      summary: Token Endpoint
      description: |
        Token endpoint for the authorization code and refresh token grants.

        Client authentication is `client_secret_basic`, `client_secret_post` or `none`,
        matching `token_endpoint_auth_methods_supported`. A client registered with
        `token_endpoint_auth_method: none` is public and sends no secret.

        The code grant fails with `invalid_grant` for an unknown, used or expired code, a
        code issued to another client, a `redirect_uri` other than the one of the
        authorization request, a missing `code_challenge` for a client which must use PKCE,
        and a missing or wrong `code_verifier`. The refresh grant fails with
        `invalid_grant` for a refresh token which is malformed, expired, not verifiable or
        issued to another client. An unknown client, a wrong secret or, on the code grant,
        a `redirect_uri` the client has not registered fail with `invalid_client`.

        The provider dispatches this endpoint by exact path match without router-level method
        restriction, so a GET reaches the handler and is rejected by it with a JSON error
        rather than a 405.
      operationId: token
      security:
        - clientBasicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrant'
                - $ref: '#/components/schemas/RefreshTokenGrant'
      responses:
        '200':
          description: Token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: |
            OAuth2 errors on this endpoint are returned with status 400, among them
            `invalid_request`, `invalid_client`, `invalid_grant`, `invalid_scope`,
            `invalid_target`, `unsupported_grant_type`, `invalid_token`,
            `insufficient_scope` and `access_denied`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCError'
        '401':
          description: |
            `invalid_client` for a client which authenticated with the `Authorization`
            header, as RFC 6749 section 5.2 requires. Carries a challenge of that scheme.
          headers:
            WWW-Authenticate:
              description: '`Basic realm="<issuer>"`.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCError'
        '500':
          description: HTML error page for non-OAuth2 internal failures.

  /konnect/v1/userinfo:
    get:
      tags: [oidc]
      summary: UserInfo Endpoint
      description: |
        Returns claims for the subject of the presented access token. The claim set depends
        on the scopes granted to that token — see `UserInfo`.

        Only bearer token authentication is accepted here; the identifier session cookie is
        not consulted.
      operationId: getUserInfo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: |
            User information. Normally JSON. If the client registration sets
            `userinfo_signed_response_alg`, the body is instead a signed JWS served as
            `application/jwt`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
            application/jwt:
              schema:
                type: string
                description: Signed JWS containing the same claims.
        '401':
          description: Missing or invalid bearer token. Empty body.
          headers:
            WWW-Authenticate:
              schema:
                type: string
        '404':
          description: HTML error page — subject no longer resolvable.
        '500':
          description: HTML error page.
    head:
      tags: [oidc]
      summary: UserInfo Endpoint (HEAD)
      operationId: getUserInfoHead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information headers, no body.
        '401':
          description: Missing or invalid bearer token.
    post:
      tags: [oidc]
      summary: UserInfo Endpoint (POST)
      operationId: getUserInfoPost
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
            application/jwt:
              schema:
                type: string
        '401':
          description: Missing or invalid bearer token.

  /signin/v1/identifier/_/endsession:
    get:
      tags: [oidc]
      summary: End Session Endpoint
      description: |
        Terminates the session and performs single logout. Like `authorize`, this endpoint
        lives under the **signin** prefix.

        Requests without an established session redirect to the identifier's goodbye page
        (`{signin}/goodbye`), including when `post_logout_redirect_uri` is supplied. When no
        redirect target can be computed the response is a 200 JSON body carrying only the
        echoed `state`.
      operationId: endSession
      parameters:
        - name: id_token_hint
          in: query
          schema:
            type: string
        - name: post_logout_redirect_uri
          in: query
          description: Must match a `post_logout_redirect_uris` entry of the client registration.
          schema:
            type: string
            format: uri
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: |
            Redirect to the goodbye page, to the identifier for confirmation, or to
            `post_logout_redirect_uri`.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '200':
          description: JSON body echoing `state`, when no redirect target is computed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  state:
                    type: string
    post:
      tags: [oidc]
      summary: End Session Endpoint (POST)
      operationId: endSessionPost
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id_token_hint:
                  type: string
                post_logout_redirect_uri:
                  type: string
                state:
                  type: string
      responses:
        '302':
          description: As for GET.
        '200':
          description: As for GET.

  /konnect/v1/session/check-session.html:
    get:
      tags: [oidc]
      summary: Session Check Iframe
      description: |
        Serves the OpenID Connect Session Management 1.0 OP iframe. This is a browser
        artifact, not an API: a static HTML document with embedded JavaScript that computes
        `session_state` from the browser-state cookie. Served with a per-request CSP nonce
        and `X-XSS-Protection`.
      operationId: checkSessionIframe
      responses:
        '200':
          description: Session check iframe HTML
          content:
            text/html:
              schema:
                type: string

  /konnect/v1/register:
    post:
      tags: [oidc]
      summary: Dynamic Client Registration (disabled by default)
      description: |
        **This endpoint is not routed unless the server is started with
        `--allow-dynamic-client-registration`.** With the flag absent — the default — the
        path returns 404 and `registration_endpoint` is omitted from the discovery document.

        In the default configuration clients are configured statically through
        `--identifier-registration-conf` (`identifier-registration.yaml`). That file is the
        real integration surface; see the `StaticClientRegistration` schema.

        The two surfaces name two fields differently: the dynamic JSON uses `client_name`
        and `client_uri` where the static YAML uses `name` and `uri`.

        A client registering with `token_endpoint_auth_method: none` is public and gets no
        secret. Every dynamically registered client must use PKCE, since nobody vouches
        for it.
      operationId: registerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: Client registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRegistrationResponse'
        '400':
          description: |
            Invalid registration metadata, as `OIDCError` with `invalid_redirect_uri` or
            `invalid_client_metadata`. A body which is not JSON is answered with an HTML
            error page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCError'
        '404':
          description: Dynamic client registration is not enabled (the default).

  # ------------------------------------------------- identifier JSON API
  /signin/v1/identifier/_/hello:
    post:
      tags: [identifier]
      summary: Authentication status and flow context
      description: |
        Reports whether the caller has a usable identifier session and returns everything the
        web app needs to render the next screen: branding, the resolved client, the requested
        scopes with their display metadata, and where to go next.

        The session cookie is read opportunistically. Its absence is **not** an error and not
        a 401 — the endpoint answers 200 with `success: false`.
      operationId: hello
      parameters:
        - $ref: '#/components/parameters/XSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelloRequest'
      responses:
        '200':
          description: |
            Always returned on a well-formed request, whether or not the caller is
            authenticated. Inspect `success`.

            This endpoint does **not** have a 204 response; an unauthenticated hello returns
            200 with `success: false`. The 204 pattern belongs to `logon` and `consent`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        '400':
          $ref: '#/components/responses/PlainTextError'

  /signin/v1/identifier/_/logon:
    post:
      tags: [identifier]
      summary: Authenticate a user
      description: |
        Validates credentials and, on success, establishes the identifier session cookie.

        When the request carries a nested `hello`, its `client_id` is passed to the identity
        backend as the logon audience, so including or omitting `hello` can change backend
        authorization scoping. A successful response embeds the same payload `hello` would
        have returned.
      operationId: logon
      parameters:
        - $ref: '#/components/parameters/XSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogonRequest'
      responses:
        '200':
          description: Authentication successful; session cookie established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogonResponse'
          headers:
            Set-Cookie:
              description: |
                Identifier session cookie. Default name `__Secure-KKT`; the name is set by
                the configured backend. Attributes:
                `Path={signinPrefix}/identifier/_/`, `Secure`, `HttpOnly`,
                `SameSite=None` by default (operator-configurable). No `Expires` or
                `Max-Age` — expiry is carried inside the encrypted value.
              schema:
                type: string
                example: __Secure-KKT=<jwe>; Path=/signin/v1/identifier/_/; HttpOnly; Secure; SameSite=None
        '204':
          description: |
            Authentication did not succeed. Also returned for a request whose params array
            describes no usable logon mode — a 1- or 2-element array, or an unknown mode
            value, is a silent failure here rather than a 400.
          headers:
            Kopano-Konnect-State:
              description: Echo of the request `state`.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/PlainTextError'
        '500':
          description: |
            Backend logon error, or failure to serialize the session cookie. Plain text.
          content:
            text/plain:
              schema:
                type: string

  /signin/v1/identifier/_/logoff:
    post:
      tags: [identifier]
      summary: Log off
      description: |
        Clears the identifier session cookie. `success` is unconditionally `true` on a
        well-formed request — this endpoint cannot report "you were not signed in".
      operationId: logoff
      parameters:
        - $ref: '#/components/parameters/XSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateRequest'
      responses:
        '200':
          description: Logoff processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
          headers:
            Set-Cookie:
              description: Session cookie cleared, with an expiry far in the past.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/PlainTextError'
        '500':
          description: Failure clearing the session cookie. Plain text.
          content:
            text/plain:
              schema:
                type: string

  /signin/v1/identifier/_/consent:
    post:
      tags: [identifier]
      summary: Record a consent decision
      description: |
        Records the user's allow or deny decision for an authorization request. The decision
        is stored in a short-lived cookie whose name is derived by hashing the request
        parameters; `authorize` then looks it up when the flow resumes.

        Because the cookie name is a hash of `state`, `client_id`, `redirect_uri`, `ref` and
        `flow_nonce`, sending any of those inconsistently produces a cookie the subsequent
        `authorize` call will not find. No error surfaces here — the flow simply asks for
        consent again.

        No session cookie is read by this endpoint.
      operationId: consent
      parameters:
        - $ref: '#/components/parameters/XSRFHeader'
        - $ref: '#/components/parameters/OriginHeader'
        - $ref: '#/components/parameters/RefererHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: 'Consent granted (`allow: true`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateResponse'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ConsentCookie'
        '204':
          description: 'Consent denied (`allow: false`).'
          headers:
            Kopano-Konnect-State:
              description: |
                Echo of the request `state`. Sent on this 204 as well — the web app reads it
                here.
              schema:
                type: string
            Set-Cookie:
              $ref: '#/components/headers/ConsentCookie'
        '400':
          $ref: '#/components/responses/PlainTextError'
        '500':
          description: Failure storing the consent cookie. Plain text.
          content:
            text/plain:
              schema:
                type: string

  # -------------------------------------------------------- external oauth2
  /signin/v1/identifier/oauth2/start:
    get:
      tags: [oauth2]
      summary: Start an external OAuth2 login
      description: Begins an OAuth2 authorization flow against a configured external authority.
      operationId: oauth2Start
      responses:
        '302':
          description: Redirect to the external OAuth2 provider, or back to `authorize` with an error.
        '400':
          description: Malformed request parameters. Plain text.

  /signin/v1/identifier/oauth2/cb:
    get:
      tags: [oauth2]
      summary: External OAuth2 callback
      operationId: oauth2Callback
      responses:
        '302':
          description: Redirect after processing the callback.
        '400':
          description: |
            Unknown or expired state. Plain text, e.g.
            `400 Bad Request - state not found`.

  # ----------------------------------------------------------------- saml2
  /signin/v1/identifier/saml2/metadata:
    get:
      tags: [saml2]
      summary: SAML2 service provider metadata
      description: |
        Only routed usefully when a SAML2 authority is configured. Otherwise returns
        `404 Not Found - saml not configured`.
      operationId: saml2Metadata
      responses:
        '200':
          description: SAML2 metadata, served as `application/samlmetadata+xml`.
          content:
            application/samlmetadata+xml:
              schema:
                type: string
        '404':
          description: No SAML2 authority configured. Plain text.

  /signin/v1/identifier/saml2/acs:
    post:
      tags: [saml2]
      summary: SAML2 Assertion Consumer Service
      operationId: saml2ACS
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SAMLResponse:
                  type: string
                RelayState:
                  type: string
      responses:
        '302':
          description: Redirect after processing the assertion.
        '400':
          description: Missing or unknown state. Plain text.

  /signin/v1/identifier/_/saml2/slo:
    get:
      tags: [saml2]
      summary: SAML2 Single Logout
      description: Requires either a `SAMLRequest` or a `SAMLResponse` parameter.
      operationId: saml2SLO
      responses:
        '302':
          description: Redirect after logout.
        '400':
          description: |
            Plain text, e.g.
            `400 Bad Request - neither SAMLRequest nor SAMLResponse parameter found`.

  # ------------------------------------------------------------- trampolin
  /signin/v1/identifier/trampolin:
    get:
      tags: [identifier]
      summary: Secure redirect
      description: Redirects to a URI held in server-side state, keyed by a state parameter.
      operationId: trampolin
      responses:
        '200':
          description: HTML page performing the redirect via JavaScript.
        '400':
          description: Missing or unknown state. Plain text, e.g. `400 Bad Request - no state`.

  /signin/v1/identifier/trampolin/trampolin.js:
    get:
      tags: [identifier]
      summary: Trampolin redirect script
      description: The JavaScript used by the trampolin page. Served as `application/javascript`.
      operationId: trampolinScript
      responses:
        '200':
          description: Script body.
          content:
            application/javascript:
              schema:
                type: string

  # ------------------------------------------------------ web app + static
  /signin/v1/identifier:
    get:
      tags: [static]
      summary: Identifier web application
      description: |
        Serves the identifier single-page application. The served HTML has
        `__PATH_PREFIX__` replaced with the signin prefix (exposed as `data-path-prefix` on
        `#root`) and `__CSP_NONCE__` replaced with a fresh per-request nonce, which is also
        named in the `Content-Security-Policy` response header.

        There is no trailing-slash variant; `{signin}/identifier/` returns 404.
      operationId: identifierApp
      responses:
        '200':
          description: Application HTML.
          content:
            text/html:
              schema:
                type: string
          headers:
            Content-Security-Policy:
              description: |
                Per-request policy. Both `script-src` and `style-src` are nonce-based, so any
                runtime style injection must carry the nonce. Current value:
                `default-src 'self'; img-src 'self' data:; font-src 'self' data:;
                script-src 'self' 'nonce-N'; style-src 'self' 'nonce-N'; base-uri 'none';
                frame-ancestors 'none';`
              schema:
                type: string

  /signin/v1/index.html:
    get:
      tags: [static]
      summary: Application HTML (service worker entry)
      operationId: identifierIndexHtml
      responses:
        '200':
          description: Same document as `{signin}/identifier`.

  /signin/v1/chooseaccount:
    get:
      tags: [static]
      summary: Account selection screen
      description: Web app entry point; serves the same SPA document, routed client-side.
      operationId: chooseAccountScreen
      responses:
        '200':
          description: Application HTML.

  /signin/v1/consent:
    get:
      tags: [static]
      summary: Consent screen
      description: Web app entry point; serves the same SPA document, routed client-side.
      operationId: consentScreen
      responses:
        '200':
          description: Application HTML.

  /signin/v1/welcome:
    get:
      tags: [static]
      summary: Welcome screen
      description: Web app entry point; serves the same SPA document, routed client-side.
      operationId: welcomeScreen
      responses:
        '200':
          description: Application HTML.

  /signin/v1/goodbye:
    get:
      tags: [static]
      summary: Goodbye screen
      description: |
        Web app entry point shown after sign-out; `endsession` redirects here. Serves the
        same SPA document, routed client-side.
      operationId: goodbyeScreen
      responses:
        '200':
          description: Application HTML.

  /signin/v1/service-worker.js:
    get:
      tags: [static]
      summary: Service worker
      description: |
        Routed, but only served if the built web app actually emits the file. The current
        build does not, so this returns 404.
      operationId: serviceWorker
      responses:
        '200':
          description: Service worker script.
        '404':
          description: Not present in the current build.

  /signin/v1/static/{path}:
    get:
      tags: [static]
      summary: Static assets
      description: |
        Serves the built web app's static files from disk. The directory is set by
        `--identifier-client-path`.
      operationId: staticAssets
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Static file content.
        '404':
          description: File not found.

  # -------------------------------------------------------------------- ops
  /health-check:
    get:
      tags: [ops]
      summary: Health check
      description: Liveness probe. Returns 200 with an empty body.
      operationId: healthCheck
      responses:
        '200':
          description: Service is up.

components:
  parameters:
    XSRFHeader:
      name: Kopano-Konnect-XSRF
      in: header
      required: true
      schema:
        type: integer
        enum: [1]
      description: |
        CSRF protection header, required by every identifier JSON endpoint. Requests
        carrying it must also present an `Origin` or `Referer` the server accepts.
    OriginHeader:
      name: Origin
      in: header
      schema:
        type: string
        format: uri
      description: |
        Request origin. Either this or `Referer` must be present and acceptable; they are
        not both optional.
    RefererHeader:
      name: Referer
      in: header
      schema:
        type: string
        format: uri
      description: Alternative to `Origin`.

  headers:
    ConsentCookie:
      description: |
        Short-lived consent cookie, name `__Secure-KKTC-<hash>` where the hash is derived
        from the consent request parameters. `Max-Age=60`,
        `Path={signinPrefix}/identifier/_/`, `Secure`, `HttpOnly`, `SameSite=None` by
        default.

        Set on **both** the allow and the deny response, because it is written before the
        decision is branched on.
      schema:
        type: string

  responses:
    PlainTextError:
      description: |
        Identifier JSON endpoints never return a JSON error body. Errors are `text/plain`
        shaped `"<status> <reason>[ - <detail>]"`, with
        `X-Content-Type-Options: nosniff`.

        Details include `failed to decode request JSON`,
        `failed to parse request values`, `params required`, `state not found` and `no state`.

        The web app does not parse these bodies. It branches on the HTTP status and
        synthesises its own error identifiers client-side.
      content:
        text/plain:
          schema:
            type: string
            example: 400 Bad Request - failed to decode request JSON

  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Secure-KKT
      description: |
        Identifier session cookie, an encrypted JWE. Default name `__Secure-KKT`; the name
        is chosen by the configured backend.

        The cookie is not required by any operation, which is why no operation declares it
        under `security:`. Endpoints that consult it treat its absence as "not signed in"
        (200 with `success: false`) rather than as an authentication failure.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        OAuth2 access token, required by the UserInfo endpoint. A JWT signed with a key from
        `jwks_uri`, with the claims described by `AccessTokenClaims`.
    clientBasicAuth:
      type: http
      scheme: basic
      description: |
        `client_secret_basic` — client id and secret in the `Authorization` header. One of
        the three advertised `token_endpoint_auth_methods_supported`, together with
        `client_secret_post` and `none`; the latter is expressed on the token endpoint as an
        empty security requirement.

  schemas:
    # ------------------------------------------------------------ discovery
    ProviderMetadata:
      type: object
      description: |
        The document is served under the OpenID Connect Discovery 1.0 well-known path and,
        unchanged, under the OAuth 2.0 Authorization Server Metadata path of
        [RFC 8414](https://datatracker.ietf.org/doc/html/rfc8414). When the issuer carries a
        path component, it is additionally served under the path-inserted and path-appended
        forms of both, as described in RFC 8414 sections 3.1 and 5.

        Responses carry `Cache-Control: public, max-age=3600`. The document only changes when
        the server is restarted.
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - userinfo_endpoint
        - jwks_uri
      properties:
        issuer:
          type: string
          format: uri
        authorization_endpoint:
          type: string
          format: uri
          description: Default `{issuer}/signin/v1/identifier/_/authorize`.
        token_endpoint:
          type: string
          format: uri
          description: Default `{issuer}/konnect/v1/token`.
        userinfo_endpoint:
          type: string
          format: uri
          description: Default `{issuer}/konnect/v1/userinfo`.
        jwks_uri:
          type: string
          format: uri
          description: Default `{issuer}/konnect/v1/jwks.json`.
        end_session_endpoint:
          type: string
          format: uri
          description: Default `{issuer}/signin/v1/identifier/_/endsession`.
        check_session_iframe:
          type: string
          format: uri
          description: Default `{issuer}/konnect/v1/session/check-session.html`.
        registration_endpoint:
          type: string
          format: uri
          description: |
            Emitted **only** when the server runs with
            `--allow-dynamic-client-registration`. Absent by default.
        scopes_supported:
          type: array
          description: |
            Deployment-dependent. Always contains `openid` and `offline_access`, plus the
            scopes the identity backend supports (`profile`, `email`, `LibgreGraph.UUID`,
            `LibreGraph.RawSub` for the libregraph backend), plus every key defined in the
            `--identifier-scopes-conf` file.

            The stable, code-defined scope set a client may rely on is
            `openid`, `offline_access`, `profile`, `email`, `LibgreGraph.NumericID`,
            `LibgreGraph.UUID`, `LibreGraph.RawSub`, `LibreGraph.GuestOK` and
            `LibreGraph.SignedLoginOK`. Note that `LibreGraph.GuestOK` and
            `LibreGraph.SignedLoginOK` are functional but are never advertised here, even
            when their features are enabled.
          items:
            type: string
        response_types_supported:
          type: array
          description: |
            Emitted as `["code", "id_token token", "id_token", "code id_token",
            "code id_token token"]`. The authorization endpoint additionally accepts bare
            `token` and `code token`, so this list under-reports the implementation.
          items:
            type: string
        grant_types_supported:
          type: array
          description: |
            Emitted as `["authorization_code", "refresh_token"]`, which is exactly what the
            token endpoint implements. The implicit flow issues its tokens from the
            authorization endpoint and has no grant type here.
          items:
            type: string
        response_modes_supported:
          type: array
          description: Emitted as `["query", "fragment"]`.
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          description: |
            Emitted as `["S256"]`. A code challenge is accepted on every code flow and, when
            present, verified at the token endpoint. Dynamically registered clients and static
            clients with `require_pkce` must send one, and every client must when the server
            runs with `--require-pkce`. `plain` is rejected by the authorization endpoint and
            is therefore not advertised.
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
          description: Emitted as `["public"]`.
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Derived from the configured signing keys, e.g. all RSA and RSA-PSS algorithms for an RSA key.
        userinfo_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: Same list as `id_token_signing_alg_values_supported`.
        request_object_signing_alg_values_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: |
            Emitted as `["client_secret_basic", "client_secret_post", "none"]`. The token
            endpoint accepts client credentials in the `Authorization` header or in the
            request body, and `none` for public clients.
        token_endpoint_auth_signing_alg_values_supported:
          type: array
          items:
            type: string
        claims_parameter_supported:
          type: boolean
        claims_supported:
          type: array
          description: |
            Emitted as `["iss", "sub", "aud", "exp", "iat", "name", "family_name",
            "given_name", "email", "email_verified"]`. Fixed, independent of scope
            configuration.

            This list under-reports UserInfo: `preferred_username` (with `profile`), and the
            lico-specific `id`, `username` and `lg.uuid` claims, are returned but not
            advertised.
          items:
            type: string
        request_parameter_supported:
          type: boolean
        request_uri_parameter_supported:
          type: boolean

    JSONWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JSONWebKey'

    JSONWebKey:
      type: object
      description: |
        Public keys only. `use` is always `sig`. `kid` defaults to the key file's base name
        unless the key material carries its own.
      properties:
        kty:
          type: string
        kid:
          type: string
        use:
          type: string
          enum: [sig]
        alg:
          type: string
        n:
          type: string
        e:
          type: string

    # --------------------------------------------------------------- token
    AuthorizationCodeGrant:
      type: object
      required: [grant_type, code]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
          description: Must equal the `redirect_uri` of the authorization request.
        client_id:
          type: string
          description: May instead be supplied via `client_secret_basic`.
        client_secret:
          type: string
          description: |
            May instead be supplied via `client_secret_basic`. Absent for a public client.
        code_verifier:
          type: string
          description: PKCE verifier. Required and validated when the code was issued with a challenge.
        resource:
          type: string
          format: uri
          description: |
            Optional. When given, it must be the resource the code was issued for, else
            `invalid_target`. Leaving it out keeps that resource.

    RefreshTokenGrant:
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
        scope:
          type: string
          description: |
            Narrows the new tokens to these scopes. Every scope must be part of the grant,
            else `invalid_scope`. Leaving it out keeps all scopes of the grant.
        resource:
          type: string
          format: uri
          description: |
            Optional. When given, it must be the resource the grant was made for, else
            `invalid_target`. Leaving it out keeps that resource.
        client_id:
          type: string
        client_secret:
          type: string
          description: Absent for a public client.

    TokenResponse:
      type: object
      description: |
        Every field but `scope` is omitted when empty. `scope` names the scopes granted to
        the access token, which may be fewer than requested.

        `redirect_uri` plays no role in the refresh grant and is ignored there. A refresh
        returns a new refresh token whenever `offline_access` is granted.
      properties:
        access_token:
          type: string
          description: A JWT with the claims described by `AccessTokenClaims`.
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Seconds. Set by `--access-token-expiration`.
        scope:
          type: string
          description: Space-delimited.
        refresh_token:
          type: string
        id_token:
          type: string

    AccessTokenClaims:
      type: object
      description: |
        The claims of an access token, a JWT signed with a key from `jwks_uri`. A resource
        server validates the signature and `exp`, requires `iss` to equal the discovery
        `issuer` and `aud` to equal its own resource identifier, and reads the granted
        scopes from `scp`. A token whose `aud` is a client is not meant for a resource
        server. Claims prefixed with `lg.` are internal to this server.
      properties:
        iss:
          type: string
          format: uri
        sub:
          type: string
        aud:
          type: array
          items:
            type: string
          description: |
            Exactly one value: the resource the token is bound to, or the client when the
            request named no resource.
        azp:
          type: string
          description: The client the token was issued to. Present only when `aud` is a resource.
        scp:
          type: string
          description: Space-delimited granted scopes.
        exp:
          type: integer
        iat:
          type: integer
        jti:
          type: string
      additionalProperties: true

    UserInfo:
      type: object
      description: |
        The claim set varies by the scopes granted to the presented access token:

        | Scope | Claims added |
        | --- | --- |
        | `openid` | `sub` |
        | `profile` | `name`, `family_name`, `given_name`, `preferred_username` |
        | `email` | `email`, `email_verified` |
        | `LibgreGraph.NumericID` | `id`, `username` |
        | `LibgreGraph.UUID` | `lg.uuid` |

        Additional claims injected internally by the access token are merged in flat, so
        callers must tolerate unknown members.

        There is no `picture` claim — the implementing struct has no such field, despite
        `picture` being mappable in a claims request.
      properties:
        sub:
          type: string
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        preferred_username:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        id:
          type: integer
          format: int64
          description: lico extension, requires the `LibgreGraph.NumericID` scope.
        username:
          type: string
          description: lico extension, requires the `LibgreGraph.NumericID` scope.
        lg.uuid:
          type: string
          description: lico extension, requires the `LibgreGraph.UUID` scope.
      additionalProperties: true

    # ------------------------------------------------- client registration
    ClientRegistrationRequest:
      type: object
      description: Dynamic registration payload. Only reachable when dynamic registration is enabled.
      required: [redirect_uris]
      properties:
        redirect_uris:
          type: array
          items:
            type: string
            format: uri
        response_types:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        application_type:
          type: string
          enum: [web, native]
        client_name:
          type: string
        client_uri:
          type: string
          format: uri
        contacts:
          type: array
          items:
            type: string
            format: email
        jwks:
          type: object
        id_token_signed_response_alg:
          type: string
        userinfo_signed_response_alg:
          type: string
          description: When set, UserInfo responses for this client are signed JWS (`application/jwt`).
        request_object_signing_alg:
          type: string
        token_endpoint_auth_method:
          type: string
          description: |
            `client_secret_basic` when omitted. `none` registers a public client without a
            secret.
        token_endpoint_auth_signing_alg:
          type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
            format: uri

    ClientRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/ClientRegistrationRequest'
        - type: object
          required: [client_id]
          properties:
            client_id:
              type: string
            client_secret:
              type: string
              description: Absent for a public client.
            client_id_issued_at:
              type: integer
            client_secret_expires_at:
              type: integer
              description: |
                Unix time, or `0` when the secret does not expire, which is the case unless
                `--dynamic-client-secret-duration` is set.

    StaticClientRegistration:
      type: object
      description: |
        One entry of the `clients:` array in the `--identifier-registration-conf` file
        (`identifier-registration.yaml`). **This is the real client configuration surface in
        a default deployment**, since dynamic registration is disabled by default.

        The same file also carries an `authorities:` array configuring external OAuth2 and
        SAML2 identity providers, which is out of scope here, and a `resources:` array of
        protected resources, see `ResourceRegistration`.
      properties:
        id:
          type: string
          description: The `client_id`.
        secret:
          type: string
          description: Client secret, in plain text in the file.
        name:
          type: string
          description: Display name shown on the consent screen. Called `client_name` in the dynamic API.
        uri:
          type: string
          description: Called `client_uri` in the dynamic API.
        trusted:
          type: boolean
          description: Skips the consent screen.
        trusted_scopes:
          type: array
          items:
            type: string
          description: Scopes auto-approved for a trusted client.
        insecure:
          type: boolean
          description: Relaxes redirect URI scheme and host validation.
        require_pkce:
          type: boolean
          description: |
            Refuses a code issued without a `code_challenge` at the token endpoint. Not
            implied by `token_endpoint_auth_method: none`.
        implicit_scopes:
          type: array
          items:
            type: string
          description: |
            Scopes injected into every authorization request for this client, whether or not
            the client asked for them. These appear in `HelloResponse.scopes`.
        application_type:
          type: string
          enum: [web, native]
        redirect_uris:
          type: array
          items:
            type: string
        post_logout_redirect_uris:
          type: array
          items:
            type: string
        origins:
          type: array
          items:
            type: string
          description: CORS allow-list.
        external_authorize_redirect_uris:
          type: array
          items:
            type: string
        contacts:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        jwks:
          type: object
          description: Inline JWK set used to validate request objects and client assertions.
        id_token_signed_response_alg:
          type: string
        userinfo_signed_response_alg:
          type: string
        request_object_signing_alg:
          type: string
        token_endpoint_auth_method:
          type: string
          description: '`none` makes a public client, which has no `secret`.'
        token_endpoint_auth_signing_alg:
          type: string

    ResourceRegistration:
      type: object
      description: |
        One entry of the `resources:` array in the `--identifier-registration-conf` file, a
        protected resource a client may name with the `resource` parameter (RFC 8707).
        Access tokens for it carry its `id` as `aud`.
      required: [id]
      properties:
        id:
          type: string
          format: uri
          description: |
            The canonical URI of the resource. It is normalized at startup like the
            `resource` parameter, with scheme and host in lower case and no trailing
            slash, and access tokens carry that form as `aud`. The resource server has to
            announce exactly it as `resource` in its protected resource metadata
            (RFC 9728) and expect it as `aud`.
        name:
          type: string
          description: Display name shown on the consent screen.
        scopes:
          type: array
          items:
            type: string
          description: |
            The scopes the resource accepts. A request naming the resource keeps only these
            and the `implicit_scopes`, besides `openid` and `offline_access`.
        implicit_scopes:
          type: array
          items:
            type: string
          description: |
            Scopes added to every request naming the resource, whether or not the client
            asked for them.

    # ----------------------------------------------------- identifier API

    HelloRequest:
      type: object
      description: |
        All members are plain strings on the wire; the server parses `scope`, `prompt` and
        `max_age` itself. A malformed `max_age` is the one parse failure that produces a 400.
      required: [state]
      properties:
        state:
          type: string
          description: |
            Client-generated echo value, not a CSRF token and unrelated to the OAuth2
            `state`. The web app generates a short random string per request and rejects any
            response whose `state` does not match.
        flow:
          type: string
          description: |
            Flow selector supplied by the web app, e.g. `oidc`. The response's `flow` is not
            a straight echo — see `HelloResponse.flow`.
        scope:
          type: string
          description: Space-delimited requested scopes.
        prompt:
          type: string
          description: Space-delimited OIDC prompt values.
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        id_token_hint:
          type: string
        max_age:
          type: string
          description: Seconds, as a string. Must parse as an integer if present.

    HelloResponse:
      type: object
      description: |
        Returned by `hello`, and embedded as `hello` in a successful `logon` response.
        Optional members are omitted entirely when empty rather than sent as null.
      required: [state, flow, success]
      properties:
        state:
          type: string
          description: |
            Echo of the request `state`. Always present, but may be an empty string — the
            copy embedded in a `logon` response echoes the nested `hello.state`, which the
            web app does not set.
        flow:
          type: string
          description: |
            Always present, may be empty. It is empty on an unauthenticated `hello` even when
            the request supplied `flow: "oidc"`, and `"oidc"` on the copy embedded in a
            successful `logon` response. It is not a straight echo.
        success:
          type: boolean
          description: Whether the caller has a usable identifier session.
        username:
          type: string
        displayName:
          type: string
          description: The only camelCase member at this level.
        next:
          type: string
          description: |
            The next step the web app should take. `consent` is returned when the client
            requires a consent screen. Absent when there is nothing to do.
        continue_uri:
          type: string
          format: uri
          description: |
            Absolute URI to resume the interrupted OIDC flow, i.e. the authorization
            endpoint.
        scopes:
          $ref: '#/components/schemas/ScopesMap'
        client:
          $ref: '#/components/schemas/ClientDetails'
        meta:
          $ref: '#/components/schemas/Meta'
        branding:
          $ref: '#/components/schemas/Branding'

    LogonRequest:
      type: object
      required: [state, params]
      properties:
        state:
          type: string
        params:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Positional logon parameters: `[username, password, mode]`. Extensible by design,
            so no maximum length is enforced — extra elements are ignored.

            Only a 3-element array can ever succeed. A 1- or 2-element array, or an unknown
            `mode`, is treated as an unsupported logon mode and answered with 204, not 400.

            An empty password is rejected in every mode except mode `0`, where it is
            mandatory. See `LogonMode`.
          example: ["user@example.com", "secret123", "1"]
        hello:
          allOf:
            - $ref: '#/components/schemas/HelloRequest'
          description: |
            Optional. When present, `hello.client_id` becomes the logon audience passed to
            the identity backend, and a successful response embeds the corresponding
            `HelloResponse`.

    LogonResponse:
      type: object
      required: [success, state]
      properties:
        success:
          type: boolean
        state:
          type: string
        hello:
          allOf:
            - $ref: '#/components/schemas/HelloResponse'
          nullable: true
          description: |
            Unlike the other optional members in this API, this key is always present and is
            explicitly `null` when the request carried no `hello`.

    ConsentRequest:
      type: object
      description: |
        None of these members are validated server-side; missing ones decode as empty
        strings or `false`. They are all inputs to the consent cookie name hash, so
        inconsistency is silently lossy rather than an error.
      required: [state, allow, scope, client_id, redirect_uri]
      properties:
        state:
          type: string
        allow:
          type: boolean
        scope:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        ref:
          type: string
        flow_nonce:
          type: string

    StateRequest:
      type: object
      description: |
        Used by `logoff`. The implementing Go struct carries no JSON tag, so the wire name is
        matched case-insensitively; `state` works, and so would `State`.
      required: [state]
      properties:
        state:
          type: string

    StateResponse:
      type: object
      required: [success, state]
      properties:
        success:
          type: boolean
        state:
          type: string

    # -------------------------------------------------- supporting schemas
    ScopesMap:
      type: object
      additionalProperties:
        type: boolean
      description: |
        Requested scopes and whether each is granted. Includes any `implicit_scopes` the
        client registration injects, so it may list scopes the client never asked for.
      example:
        openid: true
        profile: true
        email: true

    ClientDetails:
      type: object
      required: [id, display_name, redirect_uri, trusted]
      properties:
        id:
          type: string
        display_name:
          type: string
        redirect_uri:
          type: string
          format: uri
        trusted:
          type: boolean

    Meta:
      type: object
      properties:
        scopes:
          $ref: '#/components/schemas/Scopes'

    Scopes:
      type: object
      description: |
        Display metadata for the scopes in this request only — a filtered per-response view,
        not the server's scope catalogue.
      properties:
        mapping:
          type: object
          additionalProperties:
            type: string
          description: 'Scope name to definition key, e.g. `{"openid": "basic"}`.'
        definitions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ScopeDefinition'

    ScopeDefinition:
      type: object
      properties:
        priority:
          type: integer
          description: Display ordering.
        description:
          type: string
          description: |
            Literal description, when the definition supplies one instead of an `id`. Used
            whenever `descriptions` carries nothing for the active locale, so it doubles as
            the fallback.
        descriptions:
          type: object
          additionalProperties:
            type: string
          description: |
            Per locale translations of `description`, keyed by locale tag, e.g.
            `{"de": "…", "zh-CN": "…"}`. Configured per scope in the
            `--identifier-scopes-conf` file. Every translation the server holds for the
            scopes of this request is sent, because the web app picks the locale itself and
            lets the visitor change it without another request. Omitted when the definition
            has none; blank entries are dropped at load.
        id:
          type: string
          description: |
            Translation key the web app resolves to localised text, e.g.
            `scope_alias_basic`. Set for the built-in definitions.

    Branding:
      type: object
      description: |
        Operator-configurable branding, all members optional and omitted when unset. The
        mixed casing is the wire format.
      properties:
        bannerLogo:
          type: string
          description: |
            Logo for the sign-in card. Set by `--identifier-default-banner-logo`. Emitted as
            a `data:` URI when configured from a local file, which is why the CSP allows
            `data:` in `img-src`.
        bannerLogoHeight:
          type: string
          description: Size hint consumed by the web app, e.g. `small`, `normal`, `big`.
        signinPageText:
          type: string
        signinPageLogoURI:
          type: string
        usernameHintText:
          type: string
          description: |
            Label for the username field. The web app special-cases `Username` and `Email`
            and otherwise renders the value literally.
        locales:
          type: array
          items:
            type: string
          description: Locales offered by the language picker.

    LogonMode:
      type: string
      enum: ["0", "1"]
      description: |
        Third element of `LogonRequest.params`. These two values are exhaustive.

        - `"0"` — re-confirm the **already signed-in** user. Requires an empty password and a
          username equal to the current session's user; succeeds only then. Used by the
          account selection screen. It does not authenticate anyone new.
        - `"1"` — validate username and password against the identity backend.

        Any other value is logged and treated as unsupported, yielding a 204.
      example: "1"

    # -------------------------------------------------------------- errors
    OIDCError:
      type: object
      description: |
        JSON error body of the token and registration endpoints. **Not** used by the
        identifier JSON endpoints, which return plain text — see the `PlainTextError`
        response. On `authorize` these same codes are delivered as redirect parameters rather
        than as a body.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - access_denied
            - unsupported_response_type
            - unsupported_grant_type
            - invalid_scope
            - invalid_target
            - invalid_redirect_uri
            - invalid_client_metadata
            - invalid_token
            - insufficient_scope
            - server_error
            - temporarily_unavailable
            - login_required
        error_description:
          type: string
        error_uri:
          type: string
          format: uri
        state:
          type: string
          description: Present on `authorize` error redirects, echoing the request `state`.
